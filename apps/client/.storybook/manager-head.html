<link rel="icon" type="image/svg+xml" href="/storybook-favicon.svg" />
<link rel="alternate icon" href="/storybook-favicon.ico" />
<title>PlotFarm UI System</title>
<script>
  (function() {
    function updateStorybookFavicon() {
      var head = document.head || document.getElementsByTagName('head')[0];
      var links = head.querySelectorAll("link[rel*='icon']");
      for (var i = 0; i < links.length; i++) {
        links[i].parentNode.removeChild(links[i]);
      }
      var link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/svg+xml';
      link.href = '/storybook-favicon.svg';
      head.appendChild(link);
    }
    updateStorybookFavicon();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updateStorybookFavicon);
    }
    window.addEventListener('load', updateStorybookFavicon);
  })();
</script>
